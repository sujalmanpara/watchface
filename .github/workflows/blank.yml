name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradle executable
      run: chmod +x VelocityWatchFace/gradlew

    - name: Build with Gradle
      working-directory: ./VelocityWatchFace
      run: ./gradlew build --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: watchface-apk
        path: VelocityWatchFace/app/build/outputs/apk/debug/app-debug.apk
