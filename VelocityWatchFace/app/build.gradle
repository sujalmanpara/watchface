plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.velocitywatchface'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.velocitywatchface"
        minSdk 30 // Wear OS 3.0+ (Galaxy Watch 4 is Wear OS 3)
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear:wear:1.3.0'
}